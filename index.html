<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Tilt - Long vs Short Action</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; text-align: center; margin: 0; padding: 10px; }
        #game-container { max-width: 950px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        h1 { font-size: 36px; color: #2c3e50; margin: 0; }
        #score-display { font-size: 26px; font-weight: bold; color: #34495e; margin: 15px 0; }

        #video-wrapper { position: relative; width: 240px; height: 180px; margin: 0 auto 20px; background: #000; border-radius: 15px; overflow: hidden; border: 5px solid #2c3e50; }
        #webcam { width: 100%; height: 100%; transform: scaleX(-1); }
        #hold-progress { position: absolute; bottom: 0; left: 0; height: 10px; background: #27ae60; width: 0%; transition: width 0.05s linear; }

        #prompt { font-size: 38px; line-height: 1.4; min-height: 120px; font-weight: 800; color: #1a252f; padding: 0 20px; margin-bottom: 30px; }

        .options { display: flex; justify-content: space-between; gap: 40px; }
        .option-card { flex: 1; padding: 45px 20px; border: 6px solid #eee; border-radius: 20px; font-size: 34px; font-weight: 900; background: #fafafa; transition: 0.3s; }
        
        .tilting-left { border-color: #3498db; background: #e1f5fe; transform: scale(1.08); }
        .tilting-right { border-color: #e67e22; background: #fff3e0; transform: scale(1.08); }

        #feedback-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 40px; }
        #feedback-text { font-size: 65px; font-weight: 900; margin-bottom: 20px; }
        #explanation-text { font-size: 34px; max-width: 850px; line-height: 1.5; margin-bottom: 30px; color: #2c3e50; }
        
        #progress-bar-container { width: 450px; height: 18px; background: #eee; border-radius: 10px; overflow: hidden; }
        #progress-bar { width: 100%; height: 100%; background: #2c3e50; }

        .hidden { display: none !important; }
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; }
        .start-btn { padding: 25px 60px; font-size: 34px; cursor: pointer; border-radius: 15px; border: none; background: white; color: #2c3e50; font-weight: bold; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1>Grammar Tilt Quiz</h1>
        <p style="font-size: 24px; margin: 20px 0;">Tilt LEFT for Long Action | RIGHT for Short Action</p>
        <button class="start-btn" onclick="startGame()">START GAME 🚀</button>
    </div>

    <div id="game-container">
        <h1>LONG ACTION vs SHORT ACTION</h1>
        <div id="score-display">Q: 1 / 10 | Score: 0</div>
        
        <div id="video-wrapper">
            <video id="webcam" playsinline></video>
            <div id="hold-progress"></div>
        </div>

        <div id="question-box">
            <p id="prompt">Loading question...</p>
            <div class="options">
                <div id="option-left" class="option-card">⬅️ LONG ACTION<br>(Continuous)</div>
                <div id="option-right" class="option-card">SHORT ACTION ➡️<br>(Simple)</div>
            </div>
        </div>

        <div id="feedback-overlay" class="hidden">
            <h2 id="feedback-text"></h2>
            <p id="explanation-text"></p>
            <div id="progress-bar-container"><div id="progress-bar"></div></div>
            <p style="margin-top:15px; font-size:22px; color:#666;">Next question in 3 seconds...</p>
        </div>
    </div>

    <script>
        const questions = [
            { prompt: "The chef was cooking dinner.", correctAnswer: "LEFT", explanation: "Past Continuous (was cooking) shows a long action in progress." },
            { prompt: "The plates fell on the floor.", correctAnswer: "RIGHT", explanation: "Past Simple (fell) shows a short completed action." },
            { prompt: "They were dancing at the festival.", correctAnswer: "LEFT", explanation: "Past Continuous (were dancing) describes a long background action." },
            { prompt: "The music stopped suddenly.", correctAnswer: "RIGHT", explanation: "Stopped is a short action that happened at a specific moment." },
            { prompt: "She was studying for her exam.", correctAnswer: "LEFT", explanation: "Studying takes time. It is a long action (Past Continuous)." },
            { prompt: "Her phone rang loudly.", correctAnswer: "RIGHT", explanation: "Rang is a sudden short action (Past Simple)." },
            { prompt: "The children were playing outside.", correctAnswer: "LEFT", explanation: "Were playing shows an action happening over a period of time." },
            { prompt: "The lights went out.", correctAnswer: "RIGHT", explanation: "Went out happened suddenly. It is a short action." },
            { prompt: "We were walking home.", correctAnswer: "LEFT", explanation: "Walking home is a continuous action in progress." },
            { prompt: "It started to rain.", correctAnswer: "RIGHT", explanation: "Started is a short action that happened at one point in time." }
        ];

        let currentQ = 0;
        let score = 0;
        let isAnswered = false;
        let holdCounter = 0;
        const requiredHold = 12; // ~0.4 second hold
        let detectedSide = null;

        const videoElement = document.getElementById('webcam');
        const promptElement = document.getElementById('prompt');
        const holdBar = document.getElementById('hold-progress');

        const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        faceMesh.onResults(onResults);

        function startGame() {
            document.getElementById('start-overlay').classList.add('hidden');
            const camera = new Camera(videoElement, {
                onFrame: async () => { await faceMesh.send({image: videoElement}); },
                width: 480, height: 360
            });
            camera.start().then(() => updateUI());
        }

        function onResults(results) {
            if (isAnswered || !results.multiFaceLandmarks) return;
            const landmarks = results.multiFaceLandmarks[0];
            let tilt = landmarks[33].y - landmarks[263].y;

            const cL = document.getElementById('option-left');
            const cR = document.getElementById('option-right');

            if (tilt > 0.02) { 
                detectedSide = "RIGHT";
                cL.classList.remove('tilting-left');
                cR.classList.add('tilting-right');
                holdCounter++;
            } else if (tilt < -0.02) {
                detectedSide = "LEFT";
                cR.classList.remove('tilting-right');
                cL.classList.add('tilting-left');
                holdCounter++;
            } else {
                detectedSide = null;
                holdCounter = 0;
                cL.classList.remove('tilting-left');
                cR.classList.remove('tilting-right');
            }

            holdBar.style.width = ((holdCounter / requiredHold) * 100) + "%";

            if (holdCounter >= requiredHold) {
                checkAnswer(detectedSide);
                holdCounter = 0;
                holdBar.style.width = "0%";
            }
        }

        function checkAnswer(side) {
            isAnswered = true;
            const q = questions[currentQ];
            const feedbackText = document.getElementById('feedback-text');

            if (side === q.correctAnswer) {
                score++;
                feedbackText.innerText = "🌟 CORRECT! 🌟";
                feedbackText.style.color = "#27ae60";
            } else {
                feedbackText.innerText = "❌ INCORRECT ❌";
                feedbackText.style.color = "#e74c3c";
            }
            
            document.getElementById('explanation-text').innerText = q.explanation;
            document.getElementById('feedback-overlay').classList.remove('hidden');

            const nextBar = document.getElementById('progress-bar');
            nextBar.style.transition = 'none';
            nextBar.style.width = '100%';
            setTimeout(() => { nextBar.style.transition = 'width 3s linear'; nextBar.style.width = '0%'; }, 50);

            setTimeout(() => {
                if (currentQ < questions.length - 1) {
                    currentQ++;
                    isAnswered = false;
                    document.getElementById('feedback-overlay').classList.add('hidden');
                    updateUI();
                } else {
                    endGame();
                }
            }, 3000);
        }

        function updateUI() {
            promptElement.innerText = questions[currentQ].prompt;
            document.getElementById('score-display').innerText = `Q: ${currentQ + 1} / 10 | Score: ${score}`;
        }

        function endGame() {
            document.getElementById('game-container').innerHTML = `
                <h1 style="font-size:60px; margin-top:50px;">🎉 QUIZ COMPLETED!</h1>
                <p style="font-size:45px;">Your Final Score: <strong>${score} / 10</strong></p>
                <p style="font-size:24px;">Great job learning Past Simple & Past Continuous!</p>
                <button class="start-btn" onclick="location.reload()" style="margin-top:20px;">RESTART 🔄</button>
            `;
        }
    </script>
</body>
</html>
