<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilt-to-Learn Game</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        body { font-family: sans-serif; background: #f0f8ff; text-align: center; margin: 0; padding: 20px; }
        #game-container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #video-wrapper { position: relative; width: 320px; height: 240px; margin: 0 auto 20px; background: #000; border-radius: 10px; overflow: hidden; }
        #webcam { width: 100%; height: 100%; transform: scaleX(-1); }
        .options { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
        .option-card { flex: 1; padding: 20px; border: 3px solid #ddd; border-radius: 10px; font-weight: bold; }
        .active-left { border-color: #3498db; background: #e1f5fe; }
        .active-right { border-color: #e67e22; background: #fff3e0; }
        #feedback-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .hidden { display: none !important; }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Tilt to Answer!</h1>
        <div id="video-wrapper">
            <video id="webcam" playsinline></video>
        </div>

        <div id="question-box">
            <p id="prompt">Loading AI... Please wait.</p>
            <div class="options">
                <div id="option-left" class="option-card">⬅️ <span id="label-left">A</span></div>
                <div id="option-right" class="option-card"><span id="label-right">B</span> ➡️</div>
            </div>
        </div>

        <div id="feedback-overlay" class="hidden">
            <h2 id="feedback-text"></h2>
            <p id="explanation-text"></p>
            <button onclick="nextQuestion()">Next Question</button>
        </div>
    </div>

    <script>
        const questions = [
    { 
        prompt: "Olive oil comes from olives.", 
        optionA: "False", 
        optionB: "True", 
        correctAnswer: "RIGHT", 
        explanation: "Olive oil is made from olives." 
    },
    { 
        prompt: "People started growing olive trees about 6,000 years ago.", 
        optionA: "False", 
        optionB: "True", 
        correctAnswer: "RIGHT", 
        explanation: "The text says olive trees have been grown for around 6,000 years." 
    },
    { 
        prompt: "China produces the most olive oil in the world.", 
        optionA: "True", 
        optionB: "False", 
        correctAnswer: "RIGHT", 
        explanation: "Spain is the world’s biggest producer of olive oil." 
    },
    { 
        prompt: "Farmers crush olives to get olive oil.", 
        optionA: "False", 
        optionB: "True", 
        correctAnswer: "RIGHT", 
        explanation: "Crushing olives is part of the oil-making process." 
    },
    { 
        prompt: "Olive oil was only used for cooking in the past.", 
        optionA: "True", 
        optionB: "False", 
        correctAnswer: "RIGHT", 
        explanation: "It was also used for medicine, lamps, and during wars." 
    },
    { 
        prompt: "Olive oil is unhealthy for the heart.", 
        optionA: "True", 
        optionB: "False", 
        correctAnswer: "RIGHT", 
        explanation: "Studies show olive oil is good for heart health." 
    }
];

        let currentQuestionIndex = 0;
        let isAnswered = false;
        const videoElement = document.getElementById('webcam');
        const promptElement = document.getElementById('prompt');

        // Initialize FaceMesh
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        faceMesh.onResults(onResults);

        function onResults(results) {
            if (isAnswered || !results.multiFaceLandmarks) return;
            
            const landmarks = results.multiFaceLandmarks[0];
            const leftEye = landmarks[33]; 
            const rightEye = landmarks[263];
            const tilt = rightEye.y - leftEye.y;

            const leftCard = document.getElementById('option-left');
            const rightCard = document.getElementById('option-right');

            if (tilt > 0.04) {
                rightCard.classList.add('active-right');
                checkAnswer("RIGHT");
            } else if (tilt < -0.04) {
                leftCard.classList.add('active-left');
                checkAnswer("LEFT");
            } else {
                leftCard.classList.remove('active-left');
                rightCard.classList.remove('active-right');
            }
        }

        function checkAnswer(side) {
            isAnswered = true;
            const q = questions[currentQuestionIndex];
            document.getElementById('feedback-text').innerText = (side === q.correctAnswer) ? "✅ Correct!" : "❌ Try Again";
            document.getElementById('explanation-text').innerText = q.explanation;
            document.getElementById('feedback-overlay').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
            isAnswered = false;
            document.getElementById('feedback-overlay').classList.add('hidden');
            updateUI();
        }

        function updateUI() {
            const q = questions[currentQuestionIndex];
            promptElement.innerText = q.prompt;
            document.getElementById('label-left').innerText = q.optionA;
            document.getElementById('label-right').innerText = q.optionB;
        }

        // Start Camera
        const camera = new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({image: videoElement}); },
            width: 640, height: 480
        });
        
        camera.start().then(() => {
            updateUI();
        }).catch(() => {
            promptElement.innerText = "Camera error. Please allow access.";
        });
    </script>
</body>
</html>
