<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olive Oil Quiz - Calibration Mode</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; text-align: center; margin: 0; padding: 20px; color: #333; }
        #game-container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h1 { color: #556b2f; margin-bottom: 5px; }
        #score-display { font-weight: bold; color: #556b2f; margin-bottom: 10px; }
        #video-wrapper { position: relative; width: 320px; height: 240px; margin: 0 auto 10px; background: #000; border-radius: 15px; overflow: hidden; border: 4px solid #556b2f; }
        #webcam { width: 100%; height: 100%; transform: scaleX(-1); }
        .controls { margin-bottom: 20px; }
        .swap-btn { background: #666; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .options { display: flex; justify-content: space-between; gap: 20px; margin-top: 10px; }
        .option-card { flex: 1; padding: 25px; border: 4px solid #eee; border-radius: 15px; font-size: 22px; font-weight: bold; background: #fafafa; transition: 0.2s; }
        .active-left { border-color: #3498db; background: #e1f5fe; }
        .active-right { border-color: #e67e22; background: #fff3e0; }
        #prompt { font-size: 22px; min-height: 60px; font-weight: 600; margin-bottom: 20px; }
        #feedback-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.98); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .hidden { display: none !important; }
        .action-btn { padding: 15px 40px; font-size: 20px; cursor: pointer; background: #556b2f; color: white; border: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>🫒 Olive Oil Quiz 🫒</h1>
        <div id="score-display">Question: 1 / 11 | Score: 0</div>
        
        <div id="video-wrapper">
            <video id="webcam" playsinline></video>
        </div>

        <div class="controls">
            <button class="swap-btn" onclick="toggleMirror()">🔄 Swap Left/Right Logic</button>
            <p style="font-size: 12px; color: #888;">Click this if tilting right selects the left option!</p>
        </div>

        <div id="question-box">
            <p id="prompt">Loading AI...</p>
            <div class="options">
                <div id="option-left" class="option-card">⬅️ <span id="label-left">-</span></div>
                <div id="option-right" class="option-card"><span id="label-right">-</span> ➡️</div>
            </div>
        </div>

        <div id="feedback-overlay" class="hidden">
            <h2 id="feedback-text"></h2>
            <p id="explanation-text"></p>
            <button class="action-btn" id="next-btn" onclick="nextQuestion()">Next Question ➡️</button>
        </div>
    </div>

    <script>
        const questions = [
            { prompt: "Olive oil comes from olives.", optionA: "True", optionB: "False", correctAnswer: "LEFT", explanation: "Olive oil is made from olives." },
            { prompt: "People started growing olive trees about 6,000 years ago.", optionA: "False", optionB: "True", correctAnswer: "RIGHT", explanation: "The text says olive trees have been grown for around 6,000 years." },
            { prompt: "China produces the most olive oil in the world.", optionA: "False", optionB: "True", correctAnswer: "LEFT", explanation: "Spain is the world’s biggest producer of olive oil, not China." },
            { prompt: "Farmers crush olives to get olive oil.", optionA: "True", optionB: "False", correctAnswer: "LEFT", explanation: "Crushing olives is part of the oil-making process." },
            { prompt: "Olive oil was only used for cooking in the past.", optionA: "True", optionB: "False", correctAnswer: "RIGHT", explanation: "It was also used for medicine, lamps, and during wars." },
            { prompt: "Olive oil is unhealthy for the heart.", optionA: "True", optionB: "False", correctAnswer: "RIGHT", explanation: "Studies show olive oil is good for heart health." },
            { prompt: "Which word best describes olive oil?", optionA: "Liquid", optionB: "Solid", correctAnswer: "LEFT", explanation: "Olive oil can be poured easily, so it is a liquid." },
            { prompt: "What does the word 'crush' mean in the text?", optionA: "Cut carefully", optionB: "Press very hard", correctAnswer: "RIGHT", explanation: "To crush means to press something very hard." },
            { prompt: "Why do some farmers still harvest olives by hand?", optionA: "It is part of tradition", optionB: "It is faster than machines", correctAnswer: "LEFT", explanation: "The text says some farmers keep ancient traditions." },
            { prompt: "Which group of people traditionally uses olive oil?", optionA: "Polar region people", optionB: "Mediterranean people", correctAnswer: "RIGHT", explanation: "Olive oil is traditionally used in Mediterranean countries." },
            { prompt: "What happens after olives are crushed?", optionA: "The oil is separated from water", optionB: "The olives are frozen", correctAnswer: "LEFT", explanation: "After crushing, the oil is separated from the water." }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;
        let isMirroredLogic = true; // Variable to toggle logic
        
        const videoElement = document.getElementById('webcam');
        const promptElement = document.getElementById('prompt');
        const scoreElement = document.getElementById('score-display');

        function toggleMirror() {
            isMirroredLogic = !isMirroredLogic;
            alert("Tilt Logic Swapped! Try tilting now.");
        }

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        faceMesh.onResults(onResults);

        function onResults(results) {
            if (isAnswered || !results.multiFaceLandmarks) return;
            const landmarks = results.multiFaceLandmarks[0];
            
            // Standard tilt calculation
            let tilt = landmarks[263].y - landmarks[33].y;
            
            // Apply the logic flip if user clicked the button
            if (!isMirroredLogic) tilt = -tilt;

            const leftCard = document.getElementById('option-left');
            const rightCard = document.getElementById('option-right');

            if (tilt > 0.04) { 
                rightCard.classList.add('active-right');
                checkAnswer("RIGHT");
            } else if (tilt < -0.04) {
                leftCard.classList.add('active-left');
                checkAnswer("LEFT");
            } else {
                leftCard.classList.remove('active-left');
                rightCard.classList.remove('active-right');
            }
        }

        function checkAnswer(side) {
            isAnswered = true;
            const q = questions[currentQuestionIndex];
            const feedbackText = document.getElementById('feedback-text');
            
            if (side === q.correctAnswer) {
                score++;
                feedbackText.innerText = "🌟 Correct! 🌟";
                feedbackText.style.color = "#27ae60";
            } else {
                feedbackText.innerText = "❌ Incorrect ❌";
                feedbackText.style.color = "#e74c3c";
            }
            
            document.getElementById('explanation-text').innerText = q.explanation;
            document.getElementById('feedback-overlay').classList.remove('hidden');
            updateScoreUI();
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                isAnswered = false;
                document.getElementById('feedback-overlay').classList.add('hidden');
                updateUI();
                updateScoreUI();
            } else {
                showFinalResults();
            }
        }

        function updateUI() {
            const q = questions[currentQuestionIndex];
            promptElement.innerText = q.prompt;
            document.getElementById('label-left').innerText = q.optionA;
            document.getElementById('label-right').innerText = q.optionB;
        }

        function updateScoreUI() {
            scoreElement.innerText = `Question: ${currentQuestionIndex + 1} / ${questions.length} | Score: ${score}`;
        }

        function showFinalResults() {
            document.getElementById('feedback-text').innerText = "Quiz Complete!";
            document.getElementById('explanation-text').innerHTML = `Final Score: <strong>${score} / ${questions.length}</strong>`;
            document.getElementById('next-btn').innerText = "Restart Quiz";
            document.getElementById('next-btn').onclick = () => location.reload();
        }

        const camera = new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({image: videoElement}); },
            width: 640, height: 480
        });
        camera.start().then(() => { updateUI(); });
    </script>
</body>
</html>
