<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olive Oil Quiz - Mirror Fixed</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; text-align: center; margin: 0; padding: 20px; color: #333; }
        #game-container { max-width: 650px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        #score-display { font-weight: bold; color: #556b2f; margin-bottom: 10px; font-size: 18px; }
        #video-wrapper { position: relative; width: 280px; height: 210px; margin: 0 auto 20px; background: #000; border-radius: 15px; overflow: hidden; border: 3px solid #556b2f; }
        #webcam { width: 100%; height: 100%; transform: scaleX(-1); } /* Mirroring for student comfort */
        .options { display: flex; justify-content: space-between; gap: 15px; margin-top: 10px; }
        .option-card { flex: 1; padding: 25px; border: 4px solid #eee; border-radius: 15px; font-size: 22px; font-weight: bold; background: #fafafa; }
        .active-left { border-color: #3498db; background: #e1f5fe; }
        .active-right { border-color: #e67e22; background: #fff3e0; }
        #prompt { font-size: 20px; min-height: 50px; font-weight: 600; margin-bottom: 20px; padding: 0 10px; }
        #feedback-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .hidden { display: none !important; }
        .action-btn { padding: 15px 40px; font-size: 20px; cursor: pointer; background: #556b2f; color: white; border: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-display">Question: 1 / 11 | Score: 0</div>
        
        <div id="video-wrapper">
            <video id="webcam" playsinline></video>
        </div>

        <div id="question-box">
            <p id="prompt">Preparing your lesson...</p>
            <div class="options">
                <div id="option-left" class="option-card">⬅️ <span id="label-left">FALSE</span></div>
                <div id="option-right" class="option-card"><span id="label-right">TRUE</span> ➡️</div>
            </div>
        </div>

        <div id="feedback-overlay" class="hidden">
            <h2 id="feedback-text"></h2>
            <p id="explanation-text"></p>
            <button class="action-btn" onclick="nextQuestion()">Next Question ➡️</button>
        </div>
    </div>

    <script>
        const questions = [
            { prompt: "Olive oil comes from olives.", optionA: "FALSE", optionB: "TRUE", correctAnswer: "RIGHT", explanation: "Olive oil is made from olives." },
            { prompt: "People started growing olive trees about 6,000 years ago.", optionA: "FALSE", optionB: "TRUE", correctAnswer: "RIGHT", explanation: "The text says olive trees have been grown for around 6,000 years." },
            { prompt: "China produces the most olive oil in the world.", optionA: "TRUE", optionB: "FALSE", correctAnswer: "RIGHT", explanation: "Spain is the world’s biggest producer of olive oil, not China." },
            { prompt: "Farmers crush olives to get olive oil.", optionA: "FALSE", optionB: "TRUE", correctAnswer: "RIGHT", explanation: "Crushing olives is part of the oil-making process." },
            { prompt: "Olive oil was only used for cooking in the past.", optionA: "TRUE", optionB: "FALSE", correctAnswer: "RIGHT", explanation: "It was also used for medicine, lamps, and during wars." },
            { prompt: "Olive oil is unhealthy for the heart.", optionA: "TRUE", optionB: "FALSE", correctAnswer: "RIGHT", explanation: "Studies show olive oil is good for heart health." },
            { prompt: "Which word best describes olive oil?", optionA: "Solid", optionB: "Liquid", correctAnswer: "RIGHT", explanation: "Olive oil can be poured easily, so it is a liquid." },
            { prompt: "What does the word 'crush' mean in the text?", optionA: "Cut carefully", optionB: "Press very hard", correctAnswer: "RIGHT", explanation: "To crush means to press something very hard." },
            { prompt: "Why do some farmers still harvest olives by hand?", optionA: "Fast machines", optionB: "Tradition", correctAnswer: "RIGHT", explanation: "The text says some farmers keep ancient traditions." },
            { prompt: "Which group of people traditionally uses olive oil?", optionA: "Polar region", optionB: "Mediterranean", correctAnswer: "RIGHT", explanation: "Olive oil is traditionally used in Mediterranean countries." },
            { prompt: "What happens after olives are crushed?", optionA: "Frozen", optionB: "Water separation", correctAnswer: "RIGHT", explanation: "After crushing, the oil is separated from the water." }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;
        
        const videoElement = document.getElementById('webcam');
        const promptElement = document.getElementById('prompt');

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        faceMesh.onResults(onResults);

        function onResults(results) {
            if (isAnswered || !results.multiFaceLandmarks) return;
            const landmarks = results.multiFaceLandmarks[0];
            
            // This math is now specifically tuned for a mirrored laptop camera
            // Right tilt = landmarks[263].y - landmarks[33].y is POSITIVE
            let tilt = landmarks[263].y - landmarks[33].y;

            const leftCard = document.getElementById('option-left');
            const rightCard = document.getElementById('option-right');

            // If you tilt toward the RIGHT on your screen (Option B/TRUE)
            if (tilt > 0.04) { 
                rightCard.classList.add('active-right');
                checkAnswer("RIGHT");
            } else if (tilt < -0.04) {
                leftCard.classList.add('active-left');
                checkAnswer("LEFT");
            } else {
                leftCard.classList.remove('active-left');
                rightCard.classList.remove('active-right');
            }
        }

        function checkAnswer(side) {
            isAnswered = true;
            const q = questions[currentQuestionIndex];
            const feedbackText = document.getElementById('feedback-text');
