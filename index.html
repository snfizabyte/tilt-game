<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olive Oil Quiz - Auto Advance</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; text-align: center; margin: 0; padding: 20px; color: #333; }
        #game-container { max-width: 650px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        #score-display { font-weight: bold; color: #556b2f; margin-bottom: 10px; font-size: 18px; }
        #video-wrapper { position: relative; width: 280px; height: 210px; margin: 0 auto 20px; background: #000; border-radius: 15px; overflow: hidden; border: 3px solid #556b2f; }
        #webcam { width: 100%; height: 100%; transform: scaleX(-1); }
        .options { display: flex; justify-content: space-between; gap: 15px; margin-top: 10px; }
        .option-card { flex: 1; padding: 25px; border: 4px solid #eee; border-radius: 15px; font-size: 20px; font-weight: bold; background: #fafafa; transition: 0.3s; }
        .active-left { border-color: #3498db; background: #e1f5fe; transform: scale(1.05); }
        .active-right { border-color: #e67e22; background: #fff3e0; transform: scale(1.05); }
        #prompt { font-size: 19px; min-height: 50px; font-weight: 600; margin-bottom: 20px; padding: 0 10px; }
        #feedback-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .hidden { display: none !important; }
        #timer-msg { color: #888; font-size: 14px; margin-top: 20px; font-style: italic; }
        #progress-bar-container { width: 200px; height: 10px; background: #eee; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        #progress-bar { width: 100%; height: 100%; background: #556b2f; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-display">Question: 1 / 11 | Score: 0</div>
        
        <div id="video-wrapper">
            <video id="webcam" playsinline></video>
        </div>

        <div id="question-box">
            <p id="prompt">Loading Quiz...</p>
            <div class="options">
                <div id="option-left" class="option-card">⬅️ <span id="label-left">-</span></div>
                <div id="option-right" class="option-card"><span id="label-right">-</span> ➡️</div>
            </div>
        </div>

        <div id="feedback-overlay" class="hidden">
            <h2 id="feedback-text"></h2>
            <p id="explanation-text"></p>
            <div id="progress-bar-container"><div id="progress-bar"></div></div>
            <p id="timer-msg">Next question in 5 seconds...</p>
        </div>
    </div>

    <script>
        const questions = [
            { prompt: "Olive oil comes from olives.", optionA: "FALSE", optionB: "TRUE", correctAnswer: "RIGHT", explanation: "Olive oil is made from olives." },
            { prompt: "People started growing olive trees about 6,000 years ago.", optionA: "FALSE", optionB: "TRUE", correctAnswer: "RIGHT", explanation: "Olive trees have been grown for around 6,000 years." },
            { prompt: "China produces the most olive oil in the world.", optionA: "FALSE", optionB: "TRUE", correctAnswer: "LEFT", explanation: "Correct! Spain is the world’s biggest producer." },
            { prompt: "Farmers crush olives to get olive oil.", optionA: "FALSE", optionB: "TRUE", correctAnswer: "RIGHT", explanation: "Crushing olives is part of the oil-making process." },
            { prompt: "Olive oil was only used for cooking in the past.", optionA: "FALSE", optionB: "TRUE", correctAnswer: "LEFT", explanation: "It was also used for medicine, lamps, and during wars." },
            { prompt: "Olive oil is unhealthy for the heart.", optionA: "TRUE", optionB: "FALSE", correctAnswer: "RIGHT", explanation: "Studies show olive oil is good for heart health." },
            { prompt: "Which word best describes olive oil?", optionA: "Solid", optionB: "Liquid", correctAnswer: "RIGHT", explanation: "Olive oil can be poured easily, so it is a liquid." },
            { prompt: "What does the word 'crush' mean in the text?", optionA: "Press very hard", optionB: "Cut carefully", correctAnswer: "LEFT", explanation: "To crush means to press something very hard." },
            { prompt: "Why do some farmers still harvest olives by hand?", optionA: "Fast machines", optionB: "Tradition", correctAnswer: "RIGHT", explanation: "Some farmers keep ancient traditions." },
            { prompt: "Which group of people traditionally uses olive oil?", optionA: "Mediterranean", optionB: "Polar region", correctAnswer: "LEFT", explanation: "Olive oil is traditionally used in Mediterranean countries." },
            { prompt: "What happens after olives are crushed?", optionA: "Frozen", optionB: "Water separation", correctAnswer: "RIGHT", explanation: "The oil is separated from the water after crushing." }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;
        
        const videoElement = document.getElementById('webcam');
        const promptElement = document.getElementById('prompt');
        const progressBar = document.getElementById('progress-bar');

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        faceMesh.onResults(onResults);

        function onResults(results) {
            // SAFETY LOCK: Ignore camera if we are already showing feedback
            if (isAnswered || !results.multiFaceLandmarks) return;
            const landmarks = results.multiFaceLandmarks[0];
            let tilt = landmarks[33].y - landmarks[263].y;

            const leftCard = document.getElementById('option-left');
            const rightCard = document.getElementById('option-right');

            if (tilt > 0.03) { 
                rightCard.classList.add('active-right');
                checkAnswer("RIGHT");
            } else if (tilt < -0.03) {
                leftCard.classList.add('active-left');
                checkAnswer("LEFT");
            } else {
                leftCard.classList.remove('active-left');
                rightCard.classList.remove('active-right');
            }
        }

        function checkAnswer(side) {
            if (isAnswered) return; // Prevent double triggers
            isAnswered = true;

            const q = questions[currentQuestionIndex];
            const feedbackText = document.getElementById('feedback-text');
            
            if (side === q.correctAnswer) {
                score++;
                feedbackText.innerText = "🌟 Correct! 🌟";
                feedbackText.style.color = "#27ae60";
            } else {
                feedbackText.innerText = "❌ Incorrect ❌";
                feedbackText.style.color = "#e74c3c";
            }
            
            document.getElementById('explanation-text').innerText = q.explanation;
            document.getElementById('feedback-overlay').classList.remove('hidden');
            
            // Visual Progress Bar Countdown
            progressBar.style.transition = 'none';
            progressBar.style.width = '100%';
            setTimeout(() => {
                progressBar.style.transition = 'width 5s linear';
                progressBar.style.width = '0%';
            }, 50);

            // AUTOMATIC MOVE AFTER 5 SECONDS
            setTimeout(() => {
                handleNextStep();
            }, 5000);
        }

        function handleNextStep() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                isAnswered = false; // Reset for next detection
                document.getElementById('feedback-overlay').classList.add('hidden');
                
                // Clear visual highlight from cards
                document.getElementById('option-left').classList.remove('active-left');
                document.getElementById('option-right').classList.remove('active-right');
                
                updateUI();
            } else {
                showFinalScore();
            }
        }

        function showFinalScore() {
            document.getElementById('timer-msg').innerText = "Quiz Finished!";
            document.getElementById('feedback-text').innerText = "Well Done!";
            document.getElementById('explanation-text').innerHTML = `Final Score: <strong>${score} / 11</strong><br>Refreshing page to restart...`;
            setTimeout(() => location.reload(), 6000);
        }

        function updateUI() {
            const q = questions[currentQuestionIndex];
            promptElement.innerText = q.prompt;
            document.getElementById('label-left').innerText = q.optionA;
            document.getElementById('label-right').innerText = q.optionB;
            document.getElementById('score-display').innerText = `Question: ${currentQuestionIndex + 1} / 11 | Score: ${score}`;
        }

        const camera = new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({image: videoElement}); },
            width: 480, height: 360
        });
        camera.start().then(() => { updateUI(); });
    </script>
</body>
</html>
