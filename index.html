<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Tilt - Visual Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; text-align: center; margin: 0; padding: 10px; }
        #game-container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { font-size: 28px; color: #2c3e50; margin: 0; text-transform: uppercase; }
        #score-display { font-size: 22px; font-weight: bold; color: #34495e; margin: 10px 0; }
        
        /* Camera Box */
        #video-wrapper { position: relative; width: 220px; height: 160px; margin: 0 auto 15px; background: #000; border-radius: 15px; overflow: hidden; border: 4px solid #2c3e50; }
        #webcam { width: 100%; height: 100%; transform: scaleX(-1); }
        #hold-progress { position: absolute; bottom: 0; left: 0; height: 8px; background: #27ae60; width: 0%; }

        /* VISUAL ELEMENT */
        #visual-icon { font-size: 100px; margin: 10px 0; display: block; }
        #prompt { font-size: 34px; line-height: 1.2; min-height: 80px; font-weight: 800; color: #2c3e50; padding: 0 20px; margin-bottom: 20px; }
        
        .options { display: flex; justify-content: space-between; gap: 20px; }
        .option-card { flex: 1; padding: 30px 15px; border: 6px solid #eee; border-radius: 20px; font-size: 28px; font-weight: 900; background: #fafafa; transition: 0.2s; }
        .tilting-left { border-color: #3498db; background: #e1f5fe; transform: scale(1.05); }
        .tilting-right { border-color: #e67e22; background: #fff3e0; transform: scale(1.05); }

        /* Feedback Overlay */
        #feedback-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #feedback-text { font-size: 55px; font-weight: 900; }
        #explanation-text { font-size: 28px; max-width: 700px; line-height: 1.4; margin: 20px 0; }
        #progress-bar-container { width: 300px; height: 12px; background: #eee; border-radius: 10px; overflow: hidden; }
        #progress-bar { width: 100%; height: 100%; background: #2c3e50; transition: width 3s linear; }

        .hidden { display: none !important; }
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; }
        .start-btn { padding: 15px 40px; font-size: 28px; cursor: pointer; border-radius: 15px; background: white; color: #2c3e50; font-weight: bold; border: none; }
    </style>
</head>
<body>
    <div id="start-overlay">
        <h1>Grammar Action Quiz</h1>
        <p style="font-size: 20px; margin-bottom: 25px;">Tilt LEFT for Long Action | RIGHT for Short Action</p>
        <button class="start-btn" onclick="startGame()">START GAME 🚀</button>
    </div>

    <div id="game-container">
        <h1>LONG vs SHORT ACTION</h1>
        <div id="score-display">Q: 1 / 10 | Score: 0</div>
        <div id="video-wrapper">
            <video id="webcam" playsinline></video>
            <div id="hold-progress"></div>
        </div>
        <div id="question-box">
            <div id="visual-icon">⏳</div>
            <p id="prompt">Loading...</p>
            <div class="options">
                <div id="option-left" class="option-card">⬅️ LONG ACTION</div>
                <div id="option-right" class="option-card">SHORT ACTION ➡️</div>
            </div>
        </div>

        <div id="feedback-overlay" class="hidden">
            <h2 id="feedback-text"></h2>
            <p id="explanation-text"></p>
            <div id="progress-bar-container"><div id="progress-bar"></div></div>
        </div>
    </div>

    <script>
        const questions = [
            { prompt: "I was stirring the dodol.", icon: "🥣", correctAnswer: "LEFT", explanation: "Past Continuous (was stirring) = Long Action." },
            { prompt: "The gas finished.", icon: "💨", correctAnswer: "RIGHT", explanation: "The gas running out is a sudden Short Action." },
            { prompt: "We were decorating the house.", icon: "🎨", correctAnswer: "LEFT", explanation: "Decorating takes a long time." },
            { prompt: "The guests arrived.", icon: "🚪", correctAnswer: "RIGHT", explanation: "Arriving happens at a specific moment." },
            { prompt: "My mother was frying chicken.", icon: "🍗", correctAnswer: "LEFT", explanation: "Frying is a continuous Long Action." },
            { prompt: "The phone rang.", icon: "🔔", correctAnswer: "RIGHT", explanation: "A ring is a sudden interruption (Short Action)." },
            { prompt: "I was cutting onions when I cried.", icon: "🧅", correctAnswer: "LEFT", explanation: "Cutting onions is the background Long Action." },
            { prompt: "We were eating when the lights went off.", icon: "💡", correctAnswer: "RIGHT", explanation: "The lights going off is a sudden Short Action." },
            { prompt: "Grandma dropped the spoon.", icon: "🥄", correctAnswer: "RIGHT", explanation: "Dropping something is a very quick Short Action." },
            { prompt: "They were preparing food all night.", icon: "🍲", correctAnswer: "LEFT", explanation: "Preparing all night is a very Long Action." }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;
        let holdCounter = 0;
        const requiredHoldFrames = 12; 
        let currentDetectedSide = null;

        const videoElement = document.getElementById('webcam');
        const promptElement = document.getElementById('prompt');
        const iconElement = document.getElementById('visual-icon');
        const holdBar = document.getElementById('hold-progress');
        const nextProgressBar = document.getElementById('progress-bar');

        const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        faceMesh.onResults(onResults);

        function startGame() {
            document.getElementById('start-overlay').classList.add('hidden');
            const camera = new Camera(videoElement, {
                onFrame: async () => { await faceMesh.send({image: videoElement}); },
                width: 480, height: 360
            });
            camera.start().then(() => updateUI());
        }

        function onResults(results) {
            if (isAnswered || !results.multiFaceLandmarks) return;
            const landmarks = results.multiFaceLandmarks[0];
            let tilt = landmarks[33].y - landmarks[263].y;

            const leftCard = document.getElementById('option-left');
            const rightCard = document.getElementById('option-right');

            if (tilt > 0.02) { 
                currentDetectedSide = "RIGHT";
                leftCard.classList.remove('tilting-left');
                rightCard.classList.add('tilting-right');
                holdCounter++;
            } else if (tilt < -0.02) {
                currentDetectedSide = "LEFT";
                rightCard.classList.remove('tilting-right');
                leftCard.classList.add('tilting-left');
                holdCounter++;
            } else {
                currentDetectedSide = null;
                holdCounter = 0;
                leftCard.classList.remove('tilting-left');
                rightCard.classList.remove('tilting-right');
            }

            holdBar.style.width = ((holdCounter / requiredHoldFrames) * 100) + "%";

            if (holdCounter >= requiredHoldFrames) {
                checkAnswer(currentDetectedSide);
                holdCounter = 0;
                holdBar.style.width = "0%";
            }
        }

        function checkAnswer(side) {
            isAnswered = true;
            const q = questions[currentQuestionIndex];
            const feedbackText = document.getElementById('feedback-text');
            if (side === q.correctAnswer) {
                score++;
                feedbackText.innerText = "🌟 CORRECT! 🌟";
                feedbackText.style.color = "#27ae60";
            } else {
                feedbackText.innerText = "❌ INCORRECT ❌";
                feedbackText.style.color = "#e74c3c";
            }
            document.getElementById('explanation-text').innerText = q.explanation;
            document.getElementById('feedback-overlay').classList.remove('hidden');

            nextProgressBar.style.transition = 'none';
            nextProgressBar.style.width = '100%';
            setTimeout(() => {
                nextProgressBar.style.transition = 'width 3s linear';
                nextProgressBar.style.width = '0%';
            }, 50);

            setTimeout(() => {
                if (currentQuestionIndex < questions.length - 1) {
                    currentQuestionIndex++;
                    isAnswered = false;
                    document.getElementById('feedback-overlay').classList.add('hidden');
                    updateUI();
                } else {
                    showFinalScore();
                }
            }, 3000);
        }

        function showFinalScore() {
            document.getElementById('feedback-text').innerText = "DONE!";
            document.getElementById('explanation-text').innerHTML = `<span style="font-size: 50px;">Total: ${score} / 10</span>`;
            setTimeout(() => location.reload(), 5000);
        }

        function updateUI() {
            const q = questions[currentQuestionIndex];
            promptElement.innerText = q.prompt;
            iconElement.innerText = q.icon;
            document.getElementById('score-display').innerText = `Q: ${currentQuestionIndex + 1} / 10 | Score: ${score}`;
        }
    </script>
</body>
</html>
